[package]
name = "freecode-llama"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PrismML llama.cpp fork resolution and the ternary load-guard"

[dependencies]
freecode-config = { workspace = true }
freecode-models = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
zip = { workspace = true }

# `kill(2)` for the shutdown hook in `server`: it has to signal a pid from a path that may run after
# the async runtime is gone. Windows has no such signal and would need a Job Object instead.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Only so the end-to-end probe can ask the settings which model the app actually ships with; the
# crate's own layering (launcher below settings) stays untouched.
freecode-config = { workspace = true }
