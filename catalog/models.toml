[[model.packs.caveats]]
# 27B KNOWN_ISSUES.md (llama.cpp#192), for the same dense-trit kernels. #192 is still open on the
# tracker as of 2026-10-20.
condition = "backend == vulkan and gpu == intel_arc"
symptom = "hang after roughly 1,900 tokens (documented for the 27B's PTQ1_0 band)"
workaround = "run on CPU for now"
severity = "severe"
[[model.packs.caveats]]
# 27B KNOWN_ISSUES.md (llama.cpp#201): under 2 tok/s on Intel Arc, "fixed in source" for Xe2-class
# GPUs by #238. The pinned release contains #238, #252 and #291, so a source build is not the answer
# here any more — but #201 is still open, and #270 records that Xe3 iGPUs reporting an 8-wide minimum
# subgroup (Intel Arc 140T) do not get #238's fast path.
condition = "backend == vulkan and gpu == intel"
symptom = "PTQ1_0 decodes slower on Vulkan than on CUDA on the same Intel GPU; the pinned build's faster paths cover Xe2-class parts, not 8-wide-subgroup Xe3 iGPUs (#270)"
workaround = "none to apply: the pin already carries #238/#252/#291. Expect the gap on the parts #270 names"
severity = "moderate"
[[model.packs.caveats]]
# The RDNA2/HIP abort (#264, open) happens at load on the backend, so this pack carries it too: a
# HIP host steered away from PQ2_0 still cannot load.
condition = "backend == hip and gpu == rdna2 (gfx103x)"
symptom = "the server aborts during load on a consumer RDNA2 card (RX 6000 series / gfx1030), whatever the packing"
workaround = "none on HIP: install the Vulkan engine build"
severity = "fatal"

[[model.packs]]
# The official group-64 band: MODEL-FORMATS.md's table puts group-64 Q2_0 under ggml type id 42, and
# the arithmetic on this repo's own sizes proves which layout this file is — 1 212 103 520 -
# 1 146 465 120 = 65 638 400 bytes, against 4.21e9 weights x 16 bits / 64 minus the same over 128 =
# 65.8 MB. So this is the transitional-suffix-free successor to the 1.7B's `*_g64*` file, not its
# deprecated legacy predecessor, which is what prism-v7 refuses to load.
key = "Q2_0"
file = "Ternary-Bonsai-2-4B-Q2_0.gguf"
quant_type = "Q2_0"
encoding = "group-64 official Q2_0 (ggml type 42)"
