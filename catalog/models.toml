preferred_for_backends = []
notes = "The portable band: card \"the one format upstream llama.cpp can also run\", +66 MB over PQ2_0."
[[model.packs.caveats]]
# BACKEND-SUPPORT.md, "Model files and upstream compatibility".
condition = "engine_release predates the Bonsai 2 Hadamard/sign-flip integration, in a stock or an old fork build"
symptom = "the file loads and generates gibberish, because recognising ggml type 42 is not the same as applying the transforms"
workaround = "update the runtime; for this app the fork path already applies them"
severity = "severe"

