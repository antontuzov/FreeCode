[model.sampling]
system_prompt = "You are a helpful assistant"

# Card, "Generation Parameters", and SMALL-MODELS.md's sampling table agree to the digit for the
# 2B/4B/9B family, so this is the profile both sources state:
#   thinking on  — temp 1.0, top_p 0.95, top_k 20, min_p 0, presence 1.0, repetition 1.0
#   thinking off — temp 0.7, top_p 0.80, top_k 20, min_p 0, presence 1.5, repetition 1.0
# with "Apply the penalties over the last 64 tokens (llama.cpp's default window)" — which is why no
# penalty-window key exists in this schema: the launcher does not pass --repeat-last-n and does not
# need to. The header carries four of these six values itself (general.sampling.temp 1.0, top_p 0.95,
# top_k 20, min_p 0.0, penalty_repeat 1.0) and no presence key, which is what the card means by
# "Presence penalty has no GGUF metadata key, so pass it on the command line or per request".
[model.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.0
repetition_penalty = 1.0

[model.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0

[model.sampling.reasoning]
# There is no effort contract for this checkpoint. Its template's only thinking conditional is
# `enable_thinking is defined and enable_thinking is false` at the generation prompt, and the strings
# "reasoning_effort", "xhigh", "medium" and "high" do not occur in it at all — so no effort word can
# be honoured, and the picker's pick would be a claim about an effect the runtime cannot produce.
# That is a different situation from the 1.7B, whose template has no thinking branch whatever: this
# model thinks, and thinks by default (card: "Thinking mode (default)"), and this app's client can
# only send reasoning_effort, never chat_template_kwargs. `default_effort` therefore says what the
# request field carries, not what the model does — see the output floor below, which is sized for
# thinking being on. The launcher sends this generation no --reasoning-effort-allow list either: the
# word it would police is not in the template.
default_effort = "none"
supported_efforts = ["none"]
unsupported_efforts = ["low", "medium", "high", "xhigh"]
# "low" is unsupported, but no mapping was measured for it; validate.rs only demands
# `low_behaves_like` of a model whose effort words do something.
low_behaves_like = ""
never_send = ["low", "medium", "high", "xhigh"]
# Read off the pack's own header: these five keys are in the file, so a runtime seeds them from it.
# Presence penalty is the one value in the profile the file does not carry, exactly as the card says.
carried_in_gguf = ["temperature", "top_p", "top_k", "min_p", "repetition_penalty"]
not_carried_in_gguf = ["presence_penalty"]
budget_transport = "chat_template_kwargs.enable_thinking is the template's only thinking switch; llama-server's own --reasoning-budget still caps the trace"
# Same reason as the other two entries: --reasoning on would override a client's reasoning_effort
# "none", and this template cannot express the difference either way.
server_reasoning_flag = "auto"

[model.agent_constraints]
# Written out in full rather than defaulted, because inheriting the 27B's numbers would be a guess.
# The first three are read off this pack's own chat template:
#   - `raise_exception('System message must be at the beginning.')` when a system message is not
#     loop.first, and the tools block opens the one system turn a leading system message is merged
#     into — so exactly one, first.
#   - tool call arguments are walked with `tool_call.arguments|items`, which raises on an empty or
#     non-object value — the same failure the 27B records as llama.cpp#112, here provable from the
#     template instead of the issue list.
#   - an assistant turn's reasoning is recovered by splitting its content on `</think>`, so
#     re-emitting reasoning re-renders the prompt instead of reusing the cache.
one_system_message_first = true
empty_tool_arguments_as_object = true
do_not_echo_reasoning_into_history = true
# Card, "Output Length": "Even simple prompts can use 3,000+ thinking tokens, so allow at least 8,192
# output tokens with thinking on. For short answers, turn thinking off" — and the turn-off switch is
# the one this app's client cannot send, so the floor is the number that has to hold.
min_generation_budget_tokens = 8192
# The demo's general guidance ("Give the model a generous output limit (-n 16384 or more)") at the
# context below, and clamp_budget caps it at half the loaded window anyway.
recommended_generation_budget_tokens = 16384
# The card's own OpenAI-compatible server example starts `-c 32768` for this size — a quarter of the
# 262,144 training window, and the demo sizes small models down rather than up (SMALL-MODELS.md runs
# the 2B at BONSAI_CTX=8192).
recommended_context = 32768
# kv_cache_types is a property of the runtime, not of this checkpoint (27B KNOWN_ISSUES.md: q5_0 is
# several times slower, #191). One model-specific fact sits beside it: quantized KV with the MTP
# drafter on CUDA needs prism-b10776-d00e252 or newer (card + USAGE.md). The pin satisfies that floor
# as of prism-b10787-73bfe6c, so it is no longer a reason to hold the drafters back — they stay off
# because nothing in this app passes `--spec-type` and SMALL-MODELS.md declines to automate it.
kv_cache_types = ["f16", "q8_0", "q4_0"]
kv_cache_forbidden_types = ["q5_0"]

[model.benchmarks]
# No score, because no measurement is published for this size. The card carries a Files table, a
# sampling table and a packing guide but no evaluation row; the repo's other files (SHA256SUMS,
# USAGE.md, LICENSE, NOTICE.txt) are the whole listing and none of them scores anything. Searched
# where the family's other numbers live instead:
#   https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-mlx-2bit (its card says only "see the GGUF
#     packs of the same weights"),
#   the demo's BACKEND-SUPPORT.md, MODEL-FORMATS.md, SMALL-MODELS.md, VISION.md and README.md
#     ("The following benchmark and memory highlights describe 27B"),
#   community-benchmarks/bonsai2/README.md (throughput rows for 27B only, no quality suites).
# The 27B's 84.78 and the 1.7B's 58.47 are both averages over suites this checkpoint was never run
# on, so putting either of them here would be exactly the typed-in number the check exists to catch.
no_published_score = "card, MLX sibling card, repo file list, and every Bonsai-demo doc plus the community-benchmarks table: no quality suite is published for the 4B"

# No [model.throughput] table: this card publishes no throughput numbers at all, and the fields there
# are named for the machines the 27B card measured. The one speed fact worth reading is in
# common.sh's comment and the card's packing guide — PQ2_0 is the band chosen for cheaper unpacking
# and faster prompt processing, PTQ1_0 for the smallest file.
#
# Two more files ship in this repo and neither is a pack: Ternary-Bonsai-2-4B-PQ2_0-MTP-Q8_0.gguf
# (1 274 642 176 bytes, sha256 0acf517de1dc3d85c403a60df6b8b07a4878ac174f368d4390be98406a4d6c0d) is
# the PQ2_0 model with a multi-token-prediction head built in — loaded INSTEAD of PQ2_0, never
# alongside it — and Ternary-Bonsai-2-4B-DFlash2-BF16.gguf (1 575 278 208 bytes, sha256
# 4402be311018d01e31ecd0a894326e2f7bd28bc27a288c5b949799fe000808d8) is an optional block drafter for
# PQ2_0. They are not model.packs entries because that list is the choice between quantisations of
# one runtime, and a drafter is an extra launch argument (--spec-type draft-mtp --spec-draft-n-max 2,
# or -md plus --spec-type draft-dflash) that nothing in this app passes. SMALL-MODELS.md is explicit
# about not automating them either: "Automatic draft/MTP selection is not enabled here. Test the base
# model first." The digests are recorded above so a stray copy of one of those files in the weights
# directory is identifiable rather than a mystery 1.27 GB.
