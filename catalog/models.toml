# FreeCode model catalog
#
# Source of truth for every number below, per model entry:
#   HF model card : https://huggingface.co/<repo_id>/raw/main/README.md
#   HF file tree  : https://huggingface.co/api/models/<repo_id>/tree/main?recursive=true
#                   (sha256 values are the LFS `oid` fields; sizes are the LFS `size` fields, in bytes)
#   known issues  : https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/raw/main/KNOWN_ISSUES.md
#                   (only the 27B repo publishes one; the other entries say which of its findings are
#                   properties of a ggml type rather than of a size)
#   quant formats : https://raw.githubusercontent.com/PrismML-Eng/Bonsai-demo/main/MODEL-FORMATS.md
#                   — which ggml type id each band is, which backend has kernels for it, and which
#                   file names are deprecated
#   backend matrix  : https://raw.githubusercontent.com/PrismML-Eng/Bonsai-demo/main/BACKEND-SUPPORT.md
#                   — the Bonsai 2 format/Hadamard matrix per backend, the release each row was audited
#                   at, and the demo's own release baseline
#   small sizes    : https://raw.githubusercontent.com/PrismML-Eng/Bonsai-demo/main/SMALL-MODELS.md
#                   — the 2B/4B/9B sampling profiles and what the launchers do and do not automate
#   digests        : a repo's published SHA256SUMS (e.g.
#                   https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf/raw/main/SHA256SUMS),
#                   which is the same value the tree API reports as the LFS oid
#   run scripts   : https://github.com/PrismML-Eng/Bonsai-demo (scripts/common.sh,
#                   scripts/start_llama_server.sh) — where this file and the demo disagree, the demo
#                   repo wins.
#
# The GGUF header outranks the card. Every entry was written against the headers of the files
# (`general.architecture`, `.context_length`, `general.sampling.*`, the tensor type ids and the
# chat template), which is how a card that still recommends a deprecated pack gets caught. A header
# can be read without the weights: `curl -sSL -r 0-20971519 <resolve url>` is enough to reach the end
# of the KV section and the tensor list, so 20 MB answers a question about a 1.15 GB file. To re-read
# the headers of the files actually on disk against this file:
#   cargo run -p freecode-models --bin verify-hf-gguf-catalog-entry -- . --model-dir models
#
# DO NOT edit a size, bits/weight, benchmark or throughput number by hand. Re-fetch the sources above.
# If a source publishes no benchmark for a size, say so in [model.benchmarks].no_published_score with
# the places checked; validate.rs treats that statement and a measured score as the only two
# acceptable answers for a model that offers runtime packs, because a number typed in to satisfy a
# check is the lie the check exists to catch.

schema_version = 1
updated = "2026-10-16"

[defaults]
# Extra flags for every supervised `llama-server`, appended after the derived ones. Deliberately
# empty: scripts/start_llama_server.sh passes no logging flag, and --log-disable — which run_llama.sh
# does use for its one-shot CLI — would blind the supervisor to the load failure it has to explain.
# The min_p the GGUF does not carry (KNOWN_ISSUES.md "Sampling and metadata") is not a server-wide
# default either; it is a per-profile sampling value and lives in [model.sampling] below.
server_flags_extra = []

[[model]]
id = "ternary-bonsai-2-27b"
name = "Bonsai 2 27B (ternary)"
# Not offered: this size is marked off in the app's model picker. The entry stays as upstream truth
# for the resolver and the digest checks; no surface lists it or offers its packs for download.
offered = false
repo_id = "prism-ml/Ternary-Bonsai-2-27B-gguf"
base_model = "Qwen/Qwen3.8-27B"
architecture = "qwen35"                 # HF config arch tag; Bonsai GGUF reports qwen35
license = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
context_length = 262144
homepage = "https://prismml.com"
contact = "contact@prismml.com"
citation = """
@misc{bonsai2_27b,
  title  = {Bonsai 2 27B},
  author = {Prism ML},
  year   = {2026},
  month  = {September},
  url    = {https://prismml.com}
}
"""
paper_url = "https://prismml.com"
demo_repo = "https://github.com/PrismML-Eng/Bonsai-demo"

# Quantization scheme, verbatim from the model card:
# weights in {-1, 0, +1} with one shared FP16 scale per 128-weight group ("g128"), stored in a
# rotated basis (blockwise Hadamard rotation, block 1024, fixed +/-1 signs) folded offline, with the
# matching transform applied to activations at runtime.
[model.weight_format]
scheme = "ternary-g128"
alphabet = [-1, 0, 1]
scale_group_size = 128
scale_dtype = "F16"
effective_bits_per_weight = 1.72
rotation = "blockwise-hadamard"
rotation_block = 1024
rotation_applied = "offline, activation transform at runtime"
coverage = ["embeddings", "attention projections", "mlp projections", "lm head"]
metadata_key_prefix = "prism.hadamard."

# Every pack of this repo needs the PrismML fork — including F16.
# KNOWN_ISSUES.md ("Runtimes other than the PrismML build"): stock llama.cpp, Ollama and LM Studio
# cannot load PQ2_0/PTQ1_0, and F16 *loads* on stock but produces garbled output because it depends
# on metadata only the PrismML build applies. A load failure alone is therefore not enough to prove
# we are on a fork; the guard must also reject a stock binary that loads successfully.
[model.engine]
needs_fork = true
fork_repo = "PrismML-Eng/llama.cpp"
# Launch-day release prism-b10687 shipped no binaries (KNOWN_ISSUES.md "Downloads, setup and
# building from source"); b10709 is the floor for macOS/Linux/Windows/Android assets.
min_release_tag = "prism-b10709-9a9394a"
# Required GGUF metadata proving the checkpoint went through Prism's Hadamard export. An ordinary
# model quantized to PQ2_0/PTQ1_0 has no rotation metadata, loads without warning and generates
# nonsense (KNOWN_ISSUES.md, issue #242) — so presence of this key is a hard load precondition.
required_metadata_prefixes = ["prism.hadamard."]

[[model.packs]]
key = "PQ2_0"
file = "Ternary-Bonsai-2-27B-PQ2_0.gguf"
quant_type = "PQ2_0"
encoding = "trit in a 2-bit slot"
bits_per_weight = 2.13
size_bytes = 7_206_168_928
size_gb = 7.21
sha256 = "3907dc1658db1f78a9826bf8d5bcb8dc65db0d466388937af57f2294fae62ec1"
marketing_ratio_vs_fp16 = 7.5
# scripts/common.sh pq2_0_ready_backend(): mac|cpu|cuda|rocm|hip|local — and select_model_gguf()
# orders "*-PQ2_0.gguf" first for those backends.
preferred_for_backends = ["metal", "cpu", "cuda", "rocm", "hip"]
# Measured on Apple Silicon (model card throughput table) and the faster prompt-processing pack
# everywhere.
notes = "Faster prefill on every backend; the pack benchmarked on Apple M5 Pro/Max."
[[model.packs.caveats]]
# KNOWN_ISSUES.md "CPU crash on load (AVX-512 CPUs)". The condition stays in the two atoms the load
# guard can evaluate (`crates/freecode-llama/src/load_guard.rs::caveat_matches`), so the row fires only
# on the hosts it is about instead of landing on every card as "may or may not apply". The version
# scope therefore lives in the prose: the crash is what releases BEFORE llama.cpp#245 did, and the
# pinned tag contains #245 (0324c665, re-checked 2026-10-20 against the current pin 73bfe6c and
# found an ancestor of it, as of its predecessor e8fd209 too). This
# row is inert for the engine this app installs and live only for an FREECODE_ENGINE_TAG override or a
# user-supplied older binary.
condition = "backend == cpu and host_has_avx512"
symptom = "segfault while loading, even with all layers offloaded to a GPU, on an engine release before llama.cpp#245 — the pinned build carries that fix, so on it this is an untested path rather than a known crash"
workaround = "on an older release, prefer PTQ1_0; --no-repack is unconfirmed. Nothing to apply on the pinned build, which this app has not run on an AVX-512 host"
severity = "fatal"
[[model.packs.caveats]]
# KNOWN_ISSUES.md: "PQ2_0 on Vulkan silently runs on the CPU" under 2 tok/s — in the releases that
# preceded llama.cpp#238, which is in the pinned build. What is left is that no run of PQ2_0 on a
# Vulkan part has ever been measured here, and the 4B row below records why the kernels are
# device-dependent. So the pack choice stays PTQ1_0 on Vulkan, on this app's own caution.
condition = "backend == vulkan"
symptom = "on releases before llama.cpp#238, PQ2_0 silently decodes on the CPU at under 2 tok/s while logs claim full offload; on the pinned build the risk is unmeasured kernel selection, which depends on the device and driver"
workaround = "the pack recommender keeps Vulkan on PTQ1_0 until a ternary run on a Vulkan part is evidence rather than a matrix cell"
severity = "moderate"
[[model.packs.caveats]]
# KNOWN_ISSUES.md (llama.cpp#223) — still open on the tracker as of 2026-10-20, so no release,
# pinned or otherwise, closes it.
condition = "backend == hip and windows and gpu == gfx1151"
symptom = "garbled output"
workaround = "-ngl 0, or the Vulkan build with PTQ1_0"
severity = "severe"
[[model.packs.caveats]]
# KNOWN_ISSUES.md "ROCm/HIP aborts on consumer RDNA2 GPUs" — the row cites Bonsai-demo#197, which the
# tracker now redirects to llama.cpp#264, and it is open as of 2026-10-20, so no release closes it.
# The abort is a property of the HIP backend on gfx103x parts rather than of a packing, which is why
# this row sits on both runtime packs. Since 2026-10-20 the workaround below is applied rather than
# only printed: `HostHardware::refuse_hostile_backend`
# (crates/freecode-models/src/hardware.rs) swaps such a host onto the Vulkan engine, so on a machine
# that got this far the row describes the build that was refused, not the one that runs — and because
# `gpu ==` is an atom the load guard does not evaluate
# (crates/freecode-llama/src/load_guard.rs::caveat_matches), it still reaches the card as "may or may not
# apply" instead of claiming this host is affected.
condition = "backend == hip and gpu == rdna2 (gfx103x)"
symptom = "the server aborts during load on a consumer RDNA2 card (RX 6000 series / gfx1030), whatever the packing"
workaround = "none on HIP: install the Vulkan engine build. Changing pack does not help"
severity = "fatal"
[[model.packs.caveats]]
# KNOWN_ISSUES.md "RTX 5090: prebuilt Linux binaries decode erratically" (llama.cpp#199, open as of
# 2026-10-20) — the one entry on that list for which a source build IS the answer, because nothing has
# been merged to fix it: sm_120 kernels in the prebuilt Linux tarballs decode erratically on driver
# 570 hosts, reported on both ternary bands. The pinned release does not help; the reported fix is
# `-DCMAKE_CUDA_ARCHITECTURES=120a-real`. Evidence is 27B-only, so it is not copied to the smaller
# entries.
condition = "backend == cuda and linux and gpu == nvidia blackwell (sm_120)"
symptom = "erratic or catastrophic decode throughput from a prebuilt Linux CUDA build on an RTX 5090"
workaround = "build the prism branch from source with -DCMAKE_CUDA_ARCHITECTURES=120a-real, as engines/lock.toml's [from_source] records"
severity = "severe"

[[model.packs]]
key = "PTQ1_0"
file = "Ternary-Bonsai-2-27B-PTQ1_0.gguf"
quant_type = "PTQ1_0"
encoding = "dense trits"
bits_per_weight = 1.75
size_bytes = 5_946_648_928
size_gb = 5.95
sha256 = "53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3"
marketing_ratio_vs_fp16 = 9.0
# Faster decode on Ada-generation GPUs and L4 (model card); the pick wherever memory is tightest.
# Unpacking dense trits costs arithmetic.
# Vulkan is the one backend that takes PTQ1_0 by rule rather than by measurement: PQ2_0's Vulkan
# kernels are device-dependent (llama.cpp#238, in the pinned build) and no run here has settled them.
# SYCL is not listed at all, and its reason changed on 2026-10-20. #235 merged ternary SYCL loading
# on 2026-09-24 and #356 brought the TernSYCL XMX path, both inside the current pin, and upstream now
# publishes docs/backend/SYCL-bonsai.md with a measured Arc B390 run of this very pack (15.8 tok/s
# tg128). It is still not offered here: no SYCL asset is pinned in engines/lock.toml, the archive needs
# oneAPI runtime libraries this app does not ship, BACKEND-SUPPORT.md still marks the SYCL ternary
# cells ✅* (partial / needs validation), and the demo's scripts "do not automatically select or
# install SYCL yet". Intel GPUs are therefore served by Vulkan.
preferred_for_backends = ["vulkan"]
fallback_for_backends = ["metal", "cpu", "cuda", "rocm", "hip"]
notes = "The '1-bit / ~9x smaller than FP16' pack. Cheapest on disk and RAM."
[[model.packs.caveats]]
# KNOWN_ISSUES.md (llama.cpp#192) — still open on the tracker as of 2026-10-20.
condition = "backend == vulkan and gpu == intel_arc"
symptom = "hang after roughly 1,900 tokens"
workaround = "run on CPU for now"
severity = "severe"
[[model.packs.caveats]]
# KNOWN_ISSUES.md (llama.cpp#201): under 2 tok/s on Intel Arc, "fixed in source" by #238 for Xe2
# parts. The pinned release contains #238, #252 and #291, so this is no longer an argument for a
# source build — but #201 itself is still open, and #270 records that Xe3 iGPUs reporting an 8-wide
# minimum subgroup (Intel Arc 140T) do not get #238's fast path at all.
condition = "backend == vulkan and gpu == intel"
symptom = "PTQ1_0 decodes slower on Vulkan than on CUDA on the same Intel GPU; the pinned build's faster paths cover Xe2-class parts and not 8-wide-subgroup Xe3 iGPUs (#270)"
workaround = "none to apply here: the pin already carries #238/#252/#291. Expect the gap on the parts #270 names"
severity = "moderate"
[[model.packs.caveats]]
# The same RDNA2/HIP abort as on the PQ2_0 pack (#264, open): it happens at load on the backend, so
# taking the dense-trit pack does not avoid it and this row has to be here too.
condition = "backend == hip and gpu == rdna2 (gfx103x)"
symptom = "the server aborts during load on a consumer RDNA2 card (RX 6000 series / gfx1030), whatever the packing"
workaround = "none on HIP: install the Vulkan engine build"
severity = "fatal"
[[model.packs.caveats]]
# The same #199 as on the PQ2_0 pack: that report ran both ternary bands on the RTX 5090, and it is
# still open, so neither pack is safe on a prebuilt Linux CUDA build there.
condition = "backend == cuda and linux and gpu == nvidia blackwell (sm_120)"
symptom = "erratic or catastrophic decode throughput from a prebuilt Linux CUDA build on an RTX 5090"
workaround = "build the prism branch from source with -DCMAKE_CUDA_ARCHITECTURES=120a-real"
severity = "severe"

[[model.packs]]
# Shipped for reference/eval only: it is ~53.8 GB on disk (the card's "~54 GB" is rounded), does not
# fit on a normal laptop, and STILL requires the fork — stock loads it and outputs garbage.
key = "F16"
file = "Ternary-Bonsai-2-27B-F16.gguf"
quant_type = "F16"
encoding = "reference precision"
bits_per_weight = 16.0
size_bytes = 53_808_408_928
size_gb = 53.8
sha256 = "f6f3b2c9b41956c34b379ec7c301dc936bc38d79b3c24c83388dd7d76000c180"
preferred_for_backends = []
notes = "Benchmark baseline. Not offered as a runtime pack on consumer hardware."

[[model.vision]]
# Optional projector pack, loaded only while images are in context.
key = "mmproj-Q8_0"
file = "Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"
quant_type = "Q8_0"
size_bytes = 629_246_976
size_gb = 0.63
sha256 = "6807ede61d570bb86ba34b756a0fa109edc33668604de867c6ea6d8f1d631903"
recommended = true
[[model.vision]]
key = "mmproj-BF16"
file = "Ternary-Bonsai-2-27B-mmproj-BF16.gguf"
quant_type = "BF16"
size_bytes = 931_145_856
size_gb = 0.93
sha256 = "e287342d92332fa3577ed1d42e921dac9370c08da58ba9337fa450f6cc76cfd7"
recommended = false

[model.sampling]
system_prompt = "You are a helpful assistant"

# Model card, thinking mode. Verified in Bonsai-demo scripts/start_llama_server.sh, whose bonsai2
# branch launches `--temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.05`; run_llama.sh uses the same four.
# min_p is passed explicitly because the GGUF carries no min_p key (KNOWN_ISSUES.md), even though
# 0.05 is llama.cpp's own default — a runtime whose default is 0.0 would otherwise silently differ.
# Confirmed against the shipped PTQ1_0 pack's own header, whose only sampling keys are
# general.sampling.top_k = 20, general.sampling.top_p = 0.95 and general.sampling.temp = 1.0 — exactly
# the three values above, and no min_p.
[model.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repetition_penalty = 1.0

# Model card, instruct / non-thinking mode.
[model.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0

[model.sampling.reasoning]
# The chat template accepts low | medium | xhigh (and "none" to disable thinking). It does NOT
# accept "high" — sending it returns HTTP 500 (KNOWN_ISSUES.md). `low` is accepted but measured to
# use about as many tokens as xhigh, so the UI maps "low" onto xhigh and says so.
# These two lists are what the launch hands the server as --reasoning-effort-allow and
# --reasoning-effort-fallback (crates/freecode-llama/src/launch.rs::reasoning_flags), so a client other
# than this app's cannot reach the template with a level it raises on.
default_effort = "xhigh"
supported_efforts = ["xhigh", "medium", "none"]
unsupported_efforts = ["low", "high"]
low_behaves_like = "xhigh"
never_send = ["high"]
# min_p / presence_penalty / repetition_penalty are absent from the GGUF, so the launcher must pass
# them; it cannot rely on file metadata.
carried_in_gguf = ["top_k", "top_p", "temperature"]
not_carried_in_gguf = ["min_p", "presence_penalty", "repetition_penalty"]
# A thinking budget inside chat_template_kwargs is silently ignored (KNOWN_ISSUES.md): use a
# top-level request field, or the server's --reasoning-budget flag.
budget_transport = "top-level request field or --reasoning-budget"
# Leave the server at --reasoning auto: --reasoning on overrides a client's reasoning_effort "none".
server_reasoning_flag = "auto"

[model.agent_constraints]
# Each entry is a hard, engine-observed constraint the Rust tool loop must honour.
one_system_message_first = true                 # llama.cpp#? KNOWN_ISSUES.md: two or misplaced system messages -> HTTP 500
empty_tool_arguments_as_object = true           # #112: empty/non-JSON tool arguments -> HTTP 500/400; send "{}"
do_not_echo_reasoning_into_history = true       # Bonsai-demo#183: re-rendering reasoning breaks the prompt cache
min_generation_budget_tokens = 4096             # a small cap ends generation mid-thought -> empty reply; the launcher also passes it as --reasoning-max-tokens-floor, so a request from any client on the port is raised to it, not just this app's
recommended_generation_budget_tokens = 16384
recommended_context = 65536                     # card's "start here" table pairs -n 16384 with -c 65536
kv_cache_types = ["f16", "q8_0", "q4_0"]        # q5_0 is several times slower (#191)
kv_cache_forbidden_types = ["q5_0"]

[model.benchmarks]
# 14-benchmark average, thinking mode. From the model card table.
fp16_avg = 86.32
ud_q4_k_xl = { bits_per_weight = 5.2, size_gb = 17.6, avg = 85.18, percent_of_fp16 = 98.7 }
iq2_xxs = { bits_per_weight = 2.16, size_gb = 7.27, avg = 72.59, percent_of_fp16 = 84.1 }
bonsai = { bits_per_weight = 1.72, size_gb = 5.95, avg = 84.78, percent_of_fp16 = 98.2 }
by_skill = { math = 96.57, coding = 89.42, agentic = 74.92, instruction_following = 82.66 }
intelligence_density = { score_per_gb = 0.457, vs_densest_conventional = 1.8, vs_fp16 = 9.0 }

[model.throughput]
# Tokens/decode, model card. PQ2_0 tg128 on the RTX 5090; Apple numbers are decode streaming ~204
# GB/s of weights.
rtx_5090_tps = 130
l4_tps = 30
m5_max_tps = 47
m5_pro_tps = 28
m5_pro_power_w = { gpu = 27.5, cpu_plus_gpu = 34.1 }
nvidia_board_power_w = { min = 300, max = 455 }

# ─────────────────────────────────────────────────────────────────────────────
# The previous ternary generation, at the size this app actually runs on a
# laptop. Every number below comes from
#   https://huggingface.co/prism-ml/Ternary-Bonsai-1.7B-gguf/raw/main/README.md,
#   its tree API, the demo repo's MODEL-FORMATS.md / start_llama_server.sh, and
#   the two packs' own GGUF headers (35 KV keys each, read with read_header).
# ─────────────────────────────────────────────────────────────────────────────
[[model]]
id = "ternary-bonsai-1-7b"
name = "Ternary Bonsai 1.7B"
repo_id = "prism-ml/Ternary-Bonsai-1.7B-gguf"
base_model = "Qwen/Qwen3-1.7B"          # card, Model Overview: "Base model | Qwen3-1.7B"
architecture = "qwen3"                  # both packs report general.architecture = qwen3 (verified in the files)
license = "Apache-2.0"                  # card frontmatter, and general.license = apache-2.0 in the file
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
context_length = 32768                  # qwen3.context_length = 32768 in both packs, matching the card
homepage = "https://prismml.com"
contact = "contact@prismml.com"
citation = """
@techreport{ternarybonsai,
    title   = {Ternary Bonsai: 1.58-bit Language Models at 8B, 4B, and 1.7B Scale},
    author  = {Prism ML},
    year    = {2026},
    month   = {April},
    url     = {https://prismml.com}
}
"""
# The card's only white-paper link (it documents the 8B/4B/1.7B ternary generation).
paper_url = "https://github.com/PrismML-Eng/Bonsai-demo/blob/main/ternary-bonsai-8b-whitepaper.pdf"
demo_repo = "https://github.com/PrismML-Eng/Bonsai-demo"

# Card, "Quantization Format: GGUF Q2_0 (g128)": w_i = scale_g * t_i with t_i in {-1, 0, +1} and one
# shared FP16 scale per 128 weights; a 128-block is 34 bytes (2 scale + 32 codes) = 2.125 bits/weight,
# and the fourth 2-bit code point is unused. The group size differs by pack: the official group-64
# file spends 16 scale bits per 64 weights = 2.25 bits/weight, which is why it is 26,873,504 bytes
# larger — 1.72e9 weights / 64 per block * 16 bits, to the byte against the published sizes.
[model.weight_format]
scheme = "ternary-g128"
alphabet = [-1, 0, 1]
scale_group_size = 128
scale_dtype = "F16"
effective_bits_per_weight = 2.125
# This generation is stored in the plain basis: neither pack carries a single `prism.*` key (checked
# against all 35 KV keys of both files), so there is no folded Hadamard rotation and no runtime
# activation transform. Provenance is the quant type id instead, not metadata.
rotation = "none"
rotation_block = 0
rotation_applied = ""
coverage = ["embeddings", "attention projections", "MLP projections", "LM head"]
metadata_key_prefix = ""

# Still needs the PrismML fork: ggml type 142 (PQ2_0) is past upstream's GGML_TYPE_COUNT, so stock
# refuses it, and the group-128 body filed under type id 42 is refused by v7 for the opposite reason.
# The card's own words: "Q2_0 is not yet in mainline llama.cpp. Use our fork at
# PrismML-Eng/llama.cpp (prism branch, default) which adds Q2_0 support for CPU (NEON/generic) and
# Metal."
[model.engine]
needs_fork = true
fork_repo = "PrismML-Eng/llama.cpp"
# The demo's own pin for these models, recorded in engines/lock.toml as demo_pinned_tag: a prism-v7
# line build, so it reads type 142 and refuses the legacy group-128 file.
min_release_tag = "prism-b10743-adfffbe"
# Deliberately empty, and validate.rs only demands prefixes for a rotated export. Requiring
# `prism.hadamard.*` here would reject the genuine file.
required_metadata_prefixes = []

[[model.packs]]
# MODEL-FORMATS.md: PQ2_0 is the fork's group-128 band under its own ggml type id (142), about 6%
# smaller than the official group-64 file, and the band the demo selects wherever the backend has
# kernels. Verified on disk: sha256 equals the LFS oid, 310 tensors of which 197 are type 142,
# general.file_type 141.
key = "PQ2_0"
file = "Ternary-Bonsai-1.7B-PQ2_0.gguf"
quant_type = "PQ2_0"
encoding = "trit in a 2-bit slot, group 128 (ggml type 142)"
bits_per_weight = 2.125
size_bytes = 463_290_464
size_gb = 0.46
sha256 = "de68ba48a8dacb21979915991e7741b917869d71410a370df951c0c3a237ae50"
marketing_ratio_vs_fp16 = 7.5
# MODEL-FORMATS.md's PQ2_0 kernel table (Metal yes, CUDA yes, ROCm/HIP yes, CPU x86-VNNI/ARM-NEON
# yes; Vulkan and SYCL "not yet"), mirrored by common.sh pq2_0_ready_backend().
preferred_for_backends = ["metal", "cpu", "cuda", "rocm", "hip"]
# Card throughput table for this model on M4 Pro 48 GB, same 0.46 GB layout: 2,088 tok/s PP512 and
# 229 tok/s TG128 on Metal against 60 tok/s for the FP16 export (3.8x); 508/123 on 10-thread NEON.
notes = "The pack to run on this backend: group-128, 463 MB, fork kernels for Metal and CPU."
[[model.packs.caveats]]
# The two PQ2_0 failures recorded in the 27B's KNOWN_ISSUES.md are properties of the type-142
# kernels rather than of a size, so they are listed here as a documented risk to check, not as a
# measurement of this pack: no 1.7B run on those parts is published. The AVX-512 half of that is
# closed in the pinned build (llama.cpp#245 is in it), which is why the release scope is in the
# prose while the condition stays in atoms the load guard evaluates.
condition = "backend == cpu and host_has_avx512"
symptom = "segfault while loading on an engine release before llama.cpp#245 (documented for the 27B's PQ2_0 band; the same ggml type 142 kernels). The pinned build carries the fix"
workaround = "on a release before the fix, use Q2_0_g64 instead"
severity = "fatal"
[[model.packs.caveats]]
# llama.cpp#223, still open as of 2026-10-20.
condition = "backend == hip and windows and gpu == gfx1151"
symptom = "garbled output (documented for the 27B's PQ2_0 band; the same kernels)"
workaround = "-ngl 0, or the Vulkan build with Q2_0_g64"
severity = "severe"
[[model.packs.caveats]]
# KNOWN_ISSUES.md "ROCm/HIP aborts on consumer RDNA2 GPUs" (row cites Bonsai-demo#197, now
# llama.cpp#264; open as of 2026-10-20). A backend property, not a packing one, so both runtime packs
# of this model carry it — see the 27B's PQ2_0 row for the full note.
condition = "backend == hip and gpu == rdna2 (gfx103x)"
symptom = "the server aborts during load on a consumer RDNA2 card (RX 6000 series / gfx1030), whatever the packing"
workaround = "none on HIP: install the Vulkan engine build"
severity = "fatal"

[[model.packs]]
# MODEL-FORMATS.md: the official group-64 band keeps mainline compatibility — "works everywhere
# (every fork backend and mainline llama.cpp)" — and is what the demo falls back to where PQ2_0 has
# no kernels. 490 MB against 463 MB, because a 16-bit scale every 64 weights costs 0.125 extra bits.
key = "Q2_0_g64"
file = "Ternary-Bonsai-1.7B-Q2_0_g64.gguf"
quant_type = "Q2_0"
encoding = "group-64 official Q2_0 (ggml type 42)"
bits_per_weight = 2.25
size_bytes = 490_163_968
size_gb = 0.49
sha256 = "6d0ecb3d9055969b5cde332b6fdb60e67ed3599e9f73e56b977731e1467e5c91"
# Vulkan is the backend MODEL-FORMATS lists as "not yet" for PQ2_0 kernels and the one the demo's
# selection order sends to the g64 file. SYCL is not listed because this app ships no SYCL target.
preferred_for_backends = ["vulkan"]
fallback_for_backends = ["metal", "cpu", "cuda", "rocm", "hip"]
notes = "The portable band: +27 MB over PQ2_0, and the only ternary pack a stock llama.cpp can read."
[[model.packs.caveats]]
# The RDNA2/HIP abort (#264, open) happens at load on the backend, so this pack carries it too: a
# HIP host steered away from PQ2_0 still cannot load.
condition = "backend == hip and gpu == rdna2 (gfx103x)"
symptom = "the server aborts during load on a consumer RDNA2 card (RX 6000 series / gfx1030), whatever the packing"
workaround = "none on HIP: install the Vulkan engine build"
severity = "fatal"

[[model.packs]]
# The file the card still recommends — the reason this entry exists. It is the DEPRECATED legacy
# layout: a group-128 body stored under ggml type id 42, which prism-v7 reads as group-64. Proved
# natively on prism-b10772, the tag this app pinned when the message below was captured:
#   E gguf_init_from_reader: this file matches the legacy Prism Q2_0 layout (group size 128 stored
#     as ggml type id 42), but this build reads Q2_0 as the official group-64 format
#   E gguf_init_from_reader: you are probably using the wrong GGUF: use the PQ2_0 version of this
#     model (ggml type id 142) or download the group-64 Q2_0 file
# The demo agrees in its own launcher: scripts/start_llama_server.sh line 65, "Find model:
# backend-aware selection, never the deprecated legacy Q2_0".
# It stays out of `downloadable_packs` (empty preferred list, and a quant type the picker does not
# treat as a ternary band) so the app can recognise and refuse it instead of offering it.
key = "Q2_0-legacy"
file = "Ternary-Bonsai-1.7B-Q2_0.gguf"
quant_type = "Q2_0"
encoding = "DEPRECATED legacy group-128 body under ggml type 42"
bits_per_weight = 2.125
size_bytes = 463_290_464
size_gb = 0.46
sha256 = "d97d94eb564590c9f0300e54d3f87bbbb25a78693d0ade9f6e177973dcb8228a"
marketing_ratio_vs_fp16 = 7.5
preferred_for_backends = []
notes = "Card-recommended, but no prism-v7 build can read it; the byte-size-identical PQ2_0 pack is the supported twin."
[[model.packs.caveats]]
condition = "engine is prism-v7 or newer (any build that reads Q2_0 as group-64)"
symptom = "refuses to load: 'this file matches the legacy Prism Q2_0 layout'"
workaround = "download Ternary-Bonsai-1.7B-PQ2_0.gguf (same 463 MB) or the _g64 file; the frozen pre-v7 `prism` (= v5) branch is the only thing that runs this file"
severity = "fatal"

[[model.packs]]
# Card, "Files in this repo": the FP16 export, the baseline the fidelity table is measured against
# and the re-quantization source. At 3.44 GB it does fit a laptop, unlike the 27B's reference, but it
# is still not the pack to run when a 7.5x memory win is on the table.
key = "F16"
file = "Ternary-Bonsai-1.7B-F16.gguf"
quant_type = "F16"
encoding = "reference precision"
bits_per_weight = 16.0
size_bytes = 3_446_249_408
size_gb = 3.45
sha256 = "00be231b1ba8ab8b45db35d288f897fa9b5836bb6ad41762b759b6bc990b4fea"
preferred_for_backends = []
notes = "Benchmark baseline. The card measures the 2-bit pack against it at mean KL 0.000000, 100.000% top-1 agreement and a 1.0048 PPL ratio, because the ternary values land exactly on three of the four 2-bit code points."

[model.sampling]
# The card publishes no system prompt, and the pack's chat template renders a system message only
# when the caller supplies one as messages[0], so the agent sends none by default.
system_prompt = ""

# Bonsai-demo scripts/start_llama_server.sh line 117, the non-bonsai2 (ternary) family branch:
#   SAMPLING="--temp 0.7 --top-p 0.95 --top-k 20 --min-p 0"
# That variable is only expanded on the script's full-profile launch (line 123, `_full_profile=1`,
# which a non-27B reaches by setting BONSAI_GGUF), the same branch that passes `--jinja`; the plain
# older-size launch at the bottom of the file hard-codes the values in [model.sampling.instruct]
# instead. This is therefore the profile for the fully-featured run, which is what this app launches.
# min_p 0 is stated even though the file carries general.sampling.min_p = 0.0, so a build with a
# different default cannot silently change it.
[model.sampling.thinking]
temperature = 0.7
top_p = 0.95
top_k = 20
min_p = 0.0
# llama.cpp's own defaults: neither the card nor the file states a penalty for this generation, and
# inventing one would be exactly the sort of guess this catalog exists to prevent.
presence_penalty = 0.0
repetition_penalty = 1.0

# The demo's plain (non-full-profile) server path for the older sizes, start_llama_server.sh ~208:
#   --temp 0.5 --top-p 0.85 --top-k 20 --min-p 0 --reasoning-budget 0 --reasoning-format none
# Those four values are what both packs carry in their own headers (general.sampling.temp 0.5,
# top_p 0.85, top_k 20, min_p 0.0), which is why this is the profile used when thinking is off.
[model.sampling.instruct]
temperature = 0.5
top_p = 0.85
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repetition_penalty = 1.0

[model.sampling.reasoning]
# There is no effort contract for this generation. The template inside the file (4,063 chars) has no
# thinking conditional at all — the strings "thinking" and "enable_thinking" do not occur in it — and
# its generation prompt always opens an empty think block, so there is no effort level to request.
# The demo does not disagree: its plain older-size launch (start_llama_server.sh ~208) sends
#   --reasoning-budget 0 --reasoning-format none --chat-template-kwargs '{"enable_thinking": false}'
# Both mechanisms, because the script serves every generation. Only the server flags can have any
# effect on this one: the string `enable_thinking` does not occur in its template, so the kwarg is
# parsed and then ignored. For the same reason the launcher gives this generation no
# --reasoning-effort-allow list — there is no effort word for the server to police, and its /props
# says supports_reasoning_effort: false.
default_effort = "none"
supported_efforts = ["none"]
unsupported_efforts = ["low", "medium", "high", "xhigh"]
# "low" is unsupported, but there is no measured behaviour to map it onto; that field documents the
# Bonsai 2 measurement, and validate.rs only demands it of a model that can think.
low_behaves_like = ""
never_send = ["low", "medium", "high", "xhigh"]
# Verified in both packs' headers: these four keys are in the file, so stock llama.cpp would seed
# them itself. The two penalties are absent, so whoever launches has to decide them — see the
# profiles above, which state llama.cpp's own defaults rather than invent values.
carried_in_gguf = ["temperature", "top_p", "top_k", "min_p"]
not_carried_in_gguf = ["presence_penalty", "repetition_penalty"]
budget_transport = "server flags --reasoning-budget / --reasoning-format (the demo's older-size path); chat_template_kwargs has no effect because the template has no conditional"
# Same reason as the 27B: --reasoning on would override a client's reasoning_effort "none".
server_reasoning_flag = "auto"

[model.agent_constraints]
# All eight keys are written out because a defaulted struct would silently inherit the 27B's numbers.
# The first three are read off this pack's own chat template, which is the Qwen3 tool-calling one:
# a system message is only rendered from messages[0], tool arguments go through `tojson`, and an
# assistant turn's reasoning is recovered by splitting its content on the think close tag — so
# re-emitting it into history re-renders the prompt instead of reusing the cache.
one_system_message_first = true
empty_tool_arguments_as_object = true
do_not_echo_reasoning_into_history = true
# The 4k floor exists for models that emit a thinking trace (a cap that ends the run mid-thought
# yields an empty reply). This one has no thinking conditional, so the floor is llama.cpp's own
# short-request scale and the card's quickstart (-n 256) is the reference point.
min_generation_budget_tokens = 1024
recommended_generation_budget_tokens = 8192
# qwen3.context_length is 32768 in the file, and the card's context row says the same, so this entry
# cannot ask for the 64K the Bonsai 2 card pairs with -n 16384.
recommended_context = 32768
# Same llama.cpp KV-cache kernel guidance as the 27B entry (KNOWN_ISSUES.md: q5_0 is several times
# slower, #191); it is a property of the runtime, not of the checkpoint.
kv_cache_types = ["f16", "q8_0", "q4_0"]
kv_cache_forbidden_types = ["q5_0"]

[model.benchmarks]
# Card benchmark table, EvalScope v1.4.2 + vLLM 0.15.1 on H100, six suites. The FP16 reference row is
# the card's own "Qwen3 1.7B" line (3.44 GB, avg 66.57) measured on the same suite.
fp16_avg = 66.57
bonsai = { bits_per_weight = 2.125, size_gb = 0.44, avg = 58.47, percent_of_fp16 = 87.83 }
# 58.47 / 66.57. ud_q4_k_xl and iq2_xxs are omitted on purpose: the card measures no such bands for
# this size, and a row invented to fill the struct would be shown to users as a measurement.
by_skill = { "MMLU-R" = 52.9, "MuSR" = 50.8, "IFEval" = 70.1, "GSM8K" = 74.2, "HE+" = 51.8, "BFCLv3" = 51.0 }
# Card intelligence-density table, density = -ln(1 - score/100) / size_GB. Only the value the card
# prints is recorded; the ratios are not published for this model.
intelligence_density = { score_per_gb = 2.001 }

# No [model.throughput] table: the fields there are named for the machines the Bonsai 2 card measured
# (RTX 5090, L4, M5 Max, M5 Pro), and this card measures on an M4 Pro 48 GB instead — 2,088 tok/s
# PP512 / 229 tok/s TG128 on Metal, 60 tok/s for its FP16 export (3.8x), 508/123 on 10-thread NEON.
# Those numbers are on the PQ2_0 pack's notes above rather than squeezed into keys that would mislabel
# them.

# ─────────────────────────────────────────────────────────────────────────────
# The middle Bonsai 2 size, and the one this catalog can point at a picture: the repo's
# `pipeline_tag` is `image-text-to-text` and it ships two vision projectors. Every number
# below comes from
#   https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf/raw/main/README.md,
#   its tree API (sizes), the repo's own published SHA256SUMS (digests),
#   BACKEND-SUPPORT.md / MODEL-FORMATS.md / SMALL-MODELS.md / scripts/common.sh in the demo
#   repo, and the PQ2_0 pack's GGUF header, read with a 20 MB ranged GET rather than the
#   1.15 GB download (426 tensors: 201 of ggml type 142, 225 F32; 50 KV keys, of which 14
#   are `prism.hadamard.*`).
# ─────────────────────────────────────────────────────────────────────────────
[[model]]
id = "ternary-bonsai-2-4b"
name = "Bonsai 2 4B (ternary)"
# Not offered, same mark as the 27B: kept here for the resolver and the digest checks, hidden from
# the model picker and the Knowledge Center.
offered = false
repo_id = "prism-ml/Ternary-Bonsai-2-4B-gguf"
base_model = "Qwen/Qwen3.5-4B"          # card frontmatter `base_model` and its Model Overview row
architecture = "qwen35"                  # general.architecture = "qwen35" in the pack's own header
license = "Apache-2.0"                  # card frontmatter `license: apache-2.0`
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
context_length = 262144                  # qwen35.context_length = 262144 in the file, matching the card
homepage = "https://prismml.com"
contact = "contact@prismml.com"
# The card prints no BibTeX; this is the repo's own title, and September is the date HF reports for
# the repository (createdAt 2026-09-23), which is the same month the 27B card prints for the family.
citation = """
@misc{bonsai2_4b,
  title  = {Bonsai 2 Ternary 4B: GGUF},
  author = {Prism ML},
  year   = {2026},
  month  = {September},
  url    = {https://prismml.com},
  note   = {https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf}
}
"""
# The card links no paper — only prismml.com, the demo repo and the Prism ML Discord — so this is the
# home link rather than a document mislabelled as one. The gen-1 whitepaper describes a different
# generation and a different weight basis.
paper_url = "https://prismml.com"
demo_repo = "https://github.com/PrismML-Eng/Bonsai-demo"

# Card, "Weight format": ternary {-1, 0, +1} with FP16 group-wise scales, stored in a rotated basis
# ("Blockwise Hadamard rotation folded into the stored weights; the runtime applies the matching
# transform to activations"). The PQ2_0 header names that transform more precisely than the card
# does: prism.hadamard.transform = "normalized-sylvester-walsh-hadamard", version 2,
# block_size 512, axis "input-last-dimension", sign_mode "explicit", tied_output true,
# gdn_v_grouped true, sign_widths [2560, 4096, 9216] — the hidden, SSM inner and MLP widths — with
# inverse_weight_names ["token_embd.weight"], i.e. the embedding is rotated out of the basis and back.
[model.weight_format]
scheme = "ternary-g128"
alphabet = [-1, 0, 1]
# 2 bits per trit slot plus one 16-bit FP16 scale per 128 weights = 2.125 bits/weight for the packed
# tensors. The card's per-pack figures (~1.81 PTQ1_0, ~2.18 PQ2_0, ~2.31 Q2_0) are larger because it
# divides the whole file by the ~4.21B language-model parameters, which charges the 225 F32 tensors
# (normalization weights and the linear-attention `ssm_alpha`/`ssm_beta` state path, card "Higher-
# precision tensors") and the tokenizer against them.
scale_group_size = 128
scale_dtype = "F16"
effective_bits_per_weight = 2.125
rotation = "blockwise-hadamard"
# The 27B exports at block 1024; this one says 512 in its own header. Reading the file rather than
# copying the sibling entry is the only reason that difference is known.
rotation_block = 512
rotation_applied = "offline, activation transform at runtime"
coverage = ["embeddings", "attention projections", "mlp projections", "lm head"]
metadata_key_prefix = "prism.hadamard."

# Every pack of this repo needs the PrismML fork — including Q2_0. BACKEND-SUPPORT.md: "Bonsai 2 also
# needs its sign flips and model graph transformations. Format decoding or a standalone Hadamard
# kernel alone is insufficient", and "Older builds could load Q2_0 while missing those transforms and
# produce gibberish". A load failure is therefore not sufficient evidence of a wrong runtime either:
# the guard has to reject a stock binary that loads, which is what the required metadata below is for.
[model.engine]
needs_fork = true
fork_repo = "PrismML-Eng/llama.cpp"
# BACKEND-SUPPORT.md's per-row audit baselines: CPU/Metal/CUDA/ROCm-HIP retain the prism-b10709
# audit, Vulkan was audited at prism-b10743, and PQ2_0's Vulkan kernels "shipped in
# prism-b10735-842b188". b10743 is the newest of those floors over the backends this app actually
# selects, so it is the claim made here — and it is deliberately the audit floor rather than the
# demo's own release pin (prism-b10787-73bfe6c as of 2026-10-20, the tag engines/lock.toml now also
# carries). Writing the demo's pin here would make `EngineLock::satisfies` refuse to launch this
# model on a build that upstream's own table says is supported at b10743.
min_release_tag = "prism-b10743-adfffbe"
# Proves the checkpoint went through Prism's Hadamard export. Verified present: 14 `prism.hadamard.*`
# keys in the PQ2_0 header. Without them a ternary file loads silently and emits nonsense
# (27B KNOWN_ISSUES.md, issue #242) — a property of the type-142 loader, not of a model size.
required_metadata_prefixes = ["prism.hadamard."]

[[model.packs]]
# Verified on disk: sha256 equals the repo's published SHA256SUMS line and the tree API's LFS oid,
# 1 146 465 120 bytes, 426 tensors of which 201 are ggml type 142, general.file_type 141.
key = "PQ2_0"
file = "Ternary-Bonsai-2-4B-PQ2_0.gguf"
quant_type = "PQ2_0"
encoding = "trit in a 2-bit slot, group 128 (ggml type 142)"
bits_per_weight = 2.18
size_bytes = 1_146_465_120
size_gb = 1.15
sha256 = "d406b1e912c0d2a4c124ad10bf38a76ae662fdc4d24b176451403dc7b7f30409"
# 8.4 / 1.1465. The FP16 reference is the card's own "~8.4 GB at FP16" headline number, so this ratio
# carries that rounding; it is arithmetic on published values, not a measurement.
marketing_ratio_vs_fp16 = 7.3
# scripts/common.sh select_model_gguf() for the bonsai2 family puts `*-PQ2_0.gguf` first with NO
# backend filter ("Every Bonsai 2 band needs the fork's kernels, so there is no mainline-compatible
# fallback to prefer; PQ2_0 first, then dense PTQ1_0"). This entry does not list vulkan, because
# select.rs still holds that backend on PTQ1_0 — see the caveat below for what would have to change.
preferred_for_backends = ["metal", "cpu", "cuda", "rocm", "hip"]
# Card, "Choosing a Packing": PQ2_0 is "the default; cheaper to unpack, and the pack measured on
# Apple Silicon".
notes = "The default pack: faster prompt processing than PTQ1_0, and the one this app selects."
[[model.packs.caveats]]
# 27B KNOWN_ISSUES.md "CPU crash on load (AVX-512 CPUs)". Recorded here as a risk to check rather
# than a measurement: it is a property of the ggml type 142 CPU kernels, and no 4B run on such a host
# is published. llama.cpp#245 closed it and the pinned release contains that commit, so the row is
# inert for the engine this app installs — which is why the scope is prose and the condition stays
# in the atoms the load guard evaluates.
condition = "backend == cpu and host_has_avx512"
symptom = "segfault while loading, even with all layers offloaded to a GPU, on an engine release before llama.cpp#245 (documented for the 27B's PQ2_0 band, which is the same ggml type). The pinned build carries the fix"
workaround = "on a release before the fix, prefer PTQ1_0; --no-repack is unconfirmed"
severity = "fatal"
[[model.packs.caveats]]
# 27B KNOWN_ISSUES.md (llama.cpp#223), same reasoning as above. #223 is still open on the tracker as
# of 2026-10-20, so no release closes it.
condition = "backend == hip and windows and gpu == gfx1151"
symptom = "garbled output (documented for the 27B's PQ2_0 band; the same kernels)"
workaround = "-ngl 0, or the Vulkan build with PTQ1_0"
severity = "severe"
[[model.packs.caveats]]
# KNOWN_ISSUES.md "ROCm/HIP aborts on consumer RDNA2 GPUs" (Bonsai-demo#197, which the tracker
# redirects to llama.cpp#264; open as of 2026-10-20). Packing-independent, so both runtime packs of
# this model carry it — see the 27B's PQ2_0 row for why it is prose and not a matched condition.
condition = "backend == hip and gpu == rdna2 (gfx103x)"
symptom = "the server aborts during load on a consumer RDNA2 card (RX 6000 series / gfx1030), whatever the packing"
workaround = "none on HIP: install the Vulkan engine build"
severity = "fatal"
[[model.packs.caveats]]
# Two sources disagree about Vulkan for this generation, and this app follows the conservative one.
# llama.cpp#238 (the PQ2_0-on-Vulkan CPU fallback that the 27B's KNOWN_ISSUES.md reports as "under 2
# tok/s") is recorded in BACKEND-SUPPORT.md as landed and shipped in prism-b10735-842b188 — which the
# pinned tag is newer than, so the CPU fallback this row was written about is not this app's release —
# and common.sh's bonsai2 branch ignores pq2_0_ready_backend() entirely, so the demo would run PQ2_0 on
# Vulkan. BACKEND-SUPPORT still marks that cell ✅* (partial / needs validation, "no direct coopmat2
# decoder", "kernel selection depends on the device and driver"), warns that FWHT is disabled on
# Intel's Windows drivers 32.0.101.8509 up to but not including 32.0.101.8860, and says of itself:
# "No new hardware tests were run for this table." select.rs keeps Vulkan on PTQ1_0 until a 4B run on
# a Vulkan part is evidence rather than a matrix cell.
condition = "backend == vulkan"
symptom = "PQ2_0 has kernels only from prism-b10735-842b188, they are device-dependent with no coopmat2 decoder, and below that release the format silently decodes on the CPU at under 2 tok/s while the log claims full offload (llama.cpp#238)"
workaround = "the pack recommender selects PTQ1_0 on Vulkan; moving this pack there needs a measured 4B Vulkan run"
severity = "severe"
[[model.packs.caveats]]
# Card, "Vision projector". A property of the projector file, listed once on the pack the app
# defaults to: it is what the recommendation in [[model.vision]] below buys.
condition = "the BF16 mmproj is attached and several image requests run at once"
symptom = "llama-server crashes with the BF16 projector on the current fork build"
workaround = "use mmproj-Q8_0, which the card recommends and this entry marks recommended; quality is nearly the same"
severity = "severe"
[[model.packs.caveats]]
# This pack's own chat template (7,756 characters, read out of the file) switches thinking with
# `enable_thinking` at its generation prompt and does not contain the string `reasoning_effort` at
# all — unlike the 27B, whose template validates that field. So an effort word is inert here, while
# the card says thinking "can use 3,000+ thinking tokens" before answering.
# This is not a hypothetical: the app's client builds OpenAI chat requests and sends no
# chat_template_kwargs anywhere (grep the crates for it), so its thinking switch for this pack is
# `reasoning_effort: "none"` — which this template ignores. The condition is therefore always true
# for this pack, and the reply budget is the only lever this build has on trace length.
condition = "always, on this build: thinking is turned off with reasoning_effort, which this template does not read"
symptom = "thinking continues whatever the picker says, so the reply is longer than the request asked for rather than shorter"
workaround = "nothing this app can apply over its wire format: chat_template_kwargs {\"enable_thinking\": false} would work on a server the user starts themselves, and the output floor below is sized for thinking staying on"
severity = "moderate"

[[model.packs]]
