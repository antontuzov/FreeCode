size_gb = 1.21
sha256 = "64a5183b44921bdb5ac4a6f5f92007821d6ebe5c66997d3c147fd214ab9433d4"
# 8.4 / 1.2121.
marketing_ratio_vs_fp16 = 6.9
# Empty on purpose, and it is not a runtime pack this app offers: the band exists so a stock
# llama.cpp can read the weights, and this app never launches one — `engines/lock.toml` resolves a
# fork binary for every backend it ships. Its digest is recorded so the verifier and the download
