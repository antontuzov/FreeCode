# Pinned PrismML llama.cpp fork engine.
#
# Tag + asset names + sizes + digests were read from the GitHub Releases API on 2026-10-20:
#   https://api.github.com/repos/PrismML-Eng/llama.cpp/releases/tags/prism-b10787-73bfe6c
# Each `sha256` is GitHub's own `assets[].digest` for that release rather than a value transcribed
# into this file. After any pin change, re-record and re-verify it with:
#   python3 scripts/refresh-engine-digests.py            # writes
#   python3 scripts/refresh-engine-digests.py --check    # fails if any digest or size is stale
# The install path refuses to unpack an archive whose sha256 does not match the value recorded
# here, so a substituted release asset cannot reach the loader.
# The tag is NOT "whatever is newest", and an override env var (FREECODE_ENGINE_TAG) plus a from-source
# build path both exist. Two tests decide whether a release is fit to pin, and both were run for
# prism-b10787-73bfe6c on 2026-10-20.
#
# 1. Does it carry the fixes the model's own KNOWN_ISSUES.md (last checked 2026-09-23) calls "in
#    source, not in a release"? Ask GitHub whether each merge commit is an ancestor of the pinned
#    commit: compare/73bfe6c…<sha> returns `status: behind` for all of #245 0324c665, #238 3ae4f510,
#    #235 ccbf5a75, #252 c53526a0, #291 46d25326, #206 01ae597e, #196 922be44a, the #241 release
#    change 9a4dd89d, #317 8b0c19c8 and the tag prism-b10735-842b188. So this release is not missing
#    the fixes the card says only a source build has, and no caveat in catalog/models.toml may argue
#    for one on "the fix is unreleased" grounds. Re-run this check before repeating such a claim.
# 2. Does it run on this host? Recorded at the foot of this file.
#
# The previous pin (prism-b10772-e8fd209, published 2026-10-10) was replaced on 2026-10-20 because
# upstream published b10776/b10777 (2026-10-14) and b10787 (2026-10-19) since, and because the 15
# commits between the two tags are content rather than recency: 73bfe6cc adds the server's
# `--reasoning-effort-allow`/`--reasoning-effort-fallback` and `--reasoning-max-tokens-floor` switches
# (the knobs whose job docs/KNOWN_ISSUES.md recorded this app as doing in client-side policy, and which
# the launch now also does server-side), ad232815 fixes
# the Vulkan signed-FWHT fusion fallback that #349 landed, 483bdaba adds a CUDA PQ2_0 mat-vec for
# Pascal, and 2972e008 with d00e2525/e3de7152 bring the TernSYCL Intel path and its documentation.
#
# verify-hf-gguf-catalog-entry asserts: tag >= prism-b10709 (b10687 shipped no binaries), every
# target we ship has a resolvable asset, and no stock-llama.cpp path is reachable.

schema_version = 1
