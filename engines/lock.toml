asset = "llama-prism-b10772-e8fd209-bin-ubuntu-rocm-7.2-x64.tar.gz"
size_bytes = 155_865_338
recommended = true

# Deliberately unresolvable: SYCL cannot load PQ2_0 or PTQ1_0 at all ("unsupport data type",
# llama.cpp#235 still in review). We ship no SYCL target so a detection bug cannot select it; Intel
# GPUs go to the Vulkan target with PTQ1_0 instead.
[unsupported_backends]
sycl = "llama.cpp#235: cannot load PQ2_0/PTQ1_0; use vulkan + PTQ1_0"

[from_source]
# Several important fixes are merged to `prism` but not in any binary release (llama.cpp#245 AVX-512
# load crash, #238 Vulkan PQ2_0, #206 AVX2/AVX-VNNI CPU kernels, #196 Metal tensor API on newest
# chips). When the detected machine hits one of those, the resolver must offer a source build.
repo = "https://github.com/PrismML-Eng/llama.cpp"
branch = "prism"
macos = "git clone https://github.com/PrismML-Eng/llama.cpp && cd llama.cpp && cmake -B build && cmake --build build -j"
cuda = "git clone https://github.com/PrismML-Eng/llama.cpp && cd llama.cpp && cmake -B build -DGGML_CUDA=ON && cmake --build build -j"
cuda_arch_note = "source CUDA builds may need -DCMAKE_CUDA_ARCHITECTURES=89 (Ada) or 120a-real (RTX 5090), and -DGGML_CUDA_FA_ALL_QUANTS=ON for quantized KV cache with flash attention"
known_blocker = "Bonsai-demo#177: setup.sh fails to build on macOS 27 / Xcode 26.5 — prefer the prebuilt macos-arm64 asset there"
