# Pinned PrismML llama.cpp fork engine.
#
# Tag + asset names + sizes were read from the GitHub Releases API on 2026-10-12:
#   https://api.github.com/repos/PrismML-Eng/llama.cpp/releases/latest   -> prism-b10772-e8fd209
# Each target's `sha256` is GitHub's own `assets[].digest` for that release, read on 2026-10-13.
# Re-record them after any pin change with:
#   python3 scripts/refresh-engine-digests.py            # writes
#   python3 scripts/refresh-engine-digests.py --check    # fails if any digest is stale
# The install path refuses to unpack an archive whose sha256 does not match the value recorded
# here, so a substituted release asset cannot reach the loader.
# The tag is NOT "whatever is newest", and an override env var (SMOLLM_ENGINE_TAG) plus a from-source
# build path both exist. What the pin decision rests on changed on 2026-10-20, when every "fixed in
# source, not in a release" item in the model's KNOWN_ISSUES.md (last checked 2026-09-23) was tested
# against this tag by asking GitHub whether each merge commit is an ancestor of e8fd209. All of them
# are: #245 0324c665, #238 3ae4f510, #235 ccbf5a75, #252 c53526a0, #291 46d25326, #206 01ae597e,
# #196 922be44a, and the #241 release change 9a4dd89d. So this release is not missing the fixes the
# card says only a source build has, and no caveat in catalog/models.toml may argue for a source
# build on those grounds. Re-run the ancestry check before repeating any "prebuilt binaries do not
# have the fix" claim.
# What the pin is genuinely missing is the two weeks after it: upstream has since published
# prism-b10776 / b10777 (2026-10-14) and prism-b10787 (2026-10-19), which is what Bonsai-demo's
# scripts/download_binaries.sh pins now. Bumping this file to a newer tag needs its asset names,
# sizes and sha256 values re-read from the Releases API by scripts/refresh-engine-digests.py.
#
# verify-hf-gguf-catalog-entry asserts: tag >= prism-b10709 (b10687 shipped no binaries), every
# target we ship has a resolvable asset, and no stock-llama.cpp path is reachable.

schema_version = 1
