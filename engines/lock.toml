# Deliberately unresolvable — and the reason has moved twice. llama.cpp#235 merged ternary SYCL
# support on 2026-09-24 and #356 (2972e008) put the TernSYCL XMX int2×int8 path, decode attention and
# fusions for Bonsai 2 on Intel Arc into this pin, with docs/backend/SYCL-bonsai.md publishing a
# measured Arc B390 run of PTQ1_0 (pp512 353, tg128 15.8 tok/s) and docs/backend/SYCL-RELEASE.md
# documenting the `win-sycl-x64` and `ubuntu-sycl-*` archives. So Intel SYCL support is no longer
# merely theoretical. It stays unresolvable here for three reasons that are this app's own:
#   * no SYCL asset is pinned below, and SYCL-RELEASE.md is explicit that "Compilation does not
#     validate model correctness or performance on an Intel GPU" — the Linux archive also expects
#     oneAPI 2025.3.3 libraries the app does not ship;
#   * BACKEND-SUPPORT.md still marks the SYCL PQ2_0/PTQ1_0 cells ✅* (partial / needs validation),
#     with a source audit baseline of prism-b10770-6684606 rather than this release, and
#     SYCL-bonsai.md closes its own table with "other Intel GPUs have not been measured with these
#     defaults; please report numbers";
#   * the demo's own setup scripts "do not automatically select or install SYCL yet"
#     (BACKEND-SUPPORT.md, "SYCL release packages"), and common.sh's pq2_0_ready_backend() has no
#     SYCL case.
# Intel GPUs therefore go to the Vulkan target with PTQ1_0.
[unsupported_backends]
sycl = "the TernSYCL kernels (#235, #356) and a measured Arc B390 run are in this release, but upstream still marks the SYCL ternary cells ✅* partial/needs validation, no SYCL asset is pinned here, the archives need oneAPI runtime libraries, and even the demo scripts do not select SYCL; use vulkan + PTQ1_0"

[from_source]
# A source build is no longer the answer to the fixes the model's KNOWN_ISSUES.md lists as "in source
# only" — the header above records that #245, #238, #206 and #196 are each an ancestor of the pinned
# commit. It is still the answer for a machine no asset above covers, and for what upstream still
# records as open with no merged fix: #192 (PTQ1_0 hangs Intel Arc on Vulkan), #201 (PTQ1_0 Vulkan
# decode speed), #223 (gfx1151 HIP), #199 (RTX 5090 / sm_120 decodes erratically out of the prebuilt
# Linux CUDA tarballs — the one entry whose recorded fix is `-DCMAKE_CUDA_ARCHITECTURES=120a-real`
# rather than a release) and #270 (Xe3 iGPUs on 8-wide subgroups, which #238's whitelist does not
# cover). A sixth, #264 (the RDNA2/HIP abort, transferred from Bonsai-demo#197), is open with no fix
# either but a source build is not its answer here: another pinned asset is, and the app takes it
# (crates/freecode-models/src/hardware.rs::refuse_hostile_backend). All six were read back as
# `state: open` from the tracker on 2026-10-20, after the bump to this tag; none of the 15 commits
# the bump brought in closes one of them.
repo = "https://github.com/PrismML-Eng/llama.cpp"
branch = "prism"
macos = "git clone https://github.com/PrismML-Eng/llama.cpp && cd llama.cpp && cmake -B build && cmake --build build -j"
cuda = "git clone https://github.com/PrismML-Eng/llama.cpp && cd llama.cpp && cmake -B build -DGGML_CUDA=ON && cmake --build build -j"
# #317 (8b0c19c8, in the pinned release) replaced GGML_CUDA_FA_ALL_QUANTS with the finer-grained
# GGML_CUDA_FA_QUANTS, so a source build against this branch should name the new knob.
cuda_arch_note = "source CUDA builds may need -DCMAKE_CUDA_ARCHITECTURES=89 (Ada) or 120a-real (RTX 5090), and -DGGML_CUDA_FA_QUANTS=ON (formerly GGML_CUDA_FA_ALL_QUANTS, renamed by llama.cpp#317) for quantized KV cache with flash attention"
# Bonsai-demo#177 was closed on 2026-09-24 by backporting the macOS 27 SDK fix into the demo's mlx
# fork, and it was never this app's path anyway: the app only ever unpacks a prebuilt GGUF runtime,
# and has no mlx. Recorded as history rather than as a blocker.
known_blocker = "was: setup.sh failing to build mlx on macOS 27 / Xcode 26.5 (Bonsai-demo#177, closed 2026-09-24). Does not apply to this app, which ships the prebuilt macos-arm64 asset and never builds from the demo's scripts"

# Host verification, 2026-10-20 — the second test above, run against this tag on the machine this
# repository lives on (Apple Silicon, Metal backend, the 1.7B PQ2_0 pack):
#   * `bin-macos-arm64.tar.gz` fetched from the release and hashed to
#     59230b0d3e90715095a3f1b9a42bb6723308e7cf3d2d3ef562f49213e95fcfc1 / 11 573 797 bytes, both equal
#     to the values recorded above. That is what makes a digest a check rather than a note.
#   * `llama-server --version` prints `version: 0.2.0-dev (build 10787, commit 73bfe6cc4)`, which
#     `banner_matches_pin` accepts against pinned_commit = 73bfe6c.
#   * `cargo test -p freecode-llama --test real_bonsai_server -- --ignored` passes all 6 probes: the
#     load guard allowed the pack with 2 caveats surfaced, the server reached /health on Metal at
#     -ngl 99 -c 16384 and streamed a real answer, a two-turn run remembered the first turn without
#     replaying its reasoning, a stream the caller stopped kept its text, and a stock llama.cpp
#     binary was refused before the server started.
# This bump does NOT verify the other eleven targets — there is no Windows, Linux, CUDA, HIP or
# Vulkan host here, so their digests are GitHub's own and nothing more. It also deliberately left the
# three switches 73bfe6cc adds (`--reasoning-effort-allow`, `--reasoning-effort-fallback`,
# `--reasoning-max-tokens-floor`) unused: the app's client-side reasoning policy already did that job,
# and moving it onto the server is a separate change with its own testing. That change landed the same
# day — see crates/freecode-llama/src/launch.rs::reasoning_flags, and the two "Enforced at the launch as
# well" notes in docs/KNOWN_ISSUES.md for what was measured and what was not.
