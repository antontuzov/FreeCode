[workspace]
resolver = "2"
members = [
  "crates/freecode-config",
  "crates/freecode-models",
  "crates/freecode-llama",
  "crates/freecode-tools",
  "crates/freecode-core",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/antontuzov/freecode"
authors = ["Anton Tuzov"]

[workspace.dependencies]
freecode-config = { path = "crates/freecode-config" }
freecode-models = { path = "crates/freecode-models" }
freecode-llama = { path = "crates/freecode-llama" }
freecode-tools = { path = "crates/freecode-tools" }
freecode-core = { path = "crates/freecode-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
# "signal" is for the desktop host's shutdown hook: a SIGTERM or Ctrl-C that reaches the app must
# kill the supervised llama-server before the host dies, or a 6 GB server is left holding the weights
# with nobody to own it (see apps/desktop/src-tauri/src/lib.rs).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "process",
  "net",
  "signal",
  "time",
] }
futures = "0.3"
dirs = "5"
tempfile = "3"
# The read-only tool executors walk the workspace. All three are already in the tree through tauri's
# own build-time deps, so naming them here adds edges rather than packages. `regex` is chosen over a
# backtracking engine on purpose: a pattern that comes from the model must not be able to make the
# host spend a minute on one line.
glob = "0.3"
regex = "1"
walkdir = "2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Only for `kill(2)`: the shutdown hook that keeps a spawned `llama-server` from outliving the host
# has to signal a pid without a runtime to do it through. See `freecode_llama::server`.
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
