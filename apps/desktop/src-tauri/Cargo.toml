[package]
name = "smollm-desktop"
description = "SmoLLM Studio desktop host: the Tauri v2 shell that exposes the Rust catalog, engine guard and agent core to the React UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "smollm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
smollm-config = { workspace = true }
smollm-models = { workspace = true }
smollm-llama = { workspace = true }
smollm-core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-opener = "2.7.2"

# Only for the shutdown hook's SIGTERM/SIGINT listener; `tokio::signal::unix` does not exist on
# Windows, so the dependency is gated to the platforms that have the signals.
[target.'cfg(unix)'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
