[package]
name = "freecode-desktop"
description = "FreeCode desktop host: the Tauri v2 shell that exposes the free-model registry and agent core to the React UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "freecode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
freecode-config = { workspace = true }
freecode-llama = { workspace = true }
freecode-core = { workspace = true }
# The tool round runs the registry's read-only executors, so the host needs the sandbox policy and
# the offered specs directly — `freecode-core` alone only carries the vocabulary.
freecode-tools = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-opener = "2.7.2"
# The project folder is chosen with the desktop's own chooser. The dialog runs from the host rather
# than the webview, so the page is handed a path and still holds no filesystem capability of its own.
tauri-plugin-dialog = "2"
# One process owns the engine, the conversation and the remote key; a second launch must hand over
# and come forward rather than start a rival copy that can also spawn a 6 GB server.
tauri-plugin-single-instance = "2"
# A code fence's copy control writes through the host, because the webview is not a place the web
# Clipboard API can be counted on. Text only, so the image feature stays off.
arboard = { version = "3", default-features = false }
# The local OpenCode service streams its turn over SSE; the host reads that stream and checks the
# Stop flag between chunks, so it needs the timer and `select!` rather than only the runtime.
tokio = { workspace = true }
portable-pty = "0.9"
# A capture comes back from the panel as a PNG file; a chat message carries a picture as a
# `data:image/png;base64,…` URL, so the host has to put one into the other before the next request.
base64 = "0.22"

# Only for the shutdown hook's SIGTERM/SIGINT listener; `tokio::signal::unix` does not exist on
# Windows, so the dependency is gated to the platforms that have the signals.
[target.'cfg(unix)'.dependencies]
tokio = { workspace = true }

# Tauri 2.12 has no `set_dock_icon`, so the mascot the Dock wears is set through AppKit directly.
# The two `NSApplication`/`NSImage` features are the whole ask: opting into only those classes is what
# keeps this a handful of small crates rather than the AppKit binding tree. See `brand`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# A page capture is the webview's own snapshot of one rectangle: WebKit renders the frame the panel
# is showing, so no screen recording and nothing else on the display is involved.
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }
objc2-core-foundation = "0.3"
# That snapshot answers in a completion block; this is the crate that builds one.
block2 = "0.6"
# A remote API key is a credential, so it belongs in the login keychain rather than in the settings
# document the Settings surface hands back and forth. The crate talks to Security.framework directly,
# which keeps the secret out of a subprocess's argv as well as out of the JSON file.
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = { workspace = true }
# A test writes the capture a row's frame is cut from; the host itself reads PNGs through
# `freecode-tools`, so this encoder is test scaffolding rather than a second decoder.
png = "0.17"
